# ProofOrigin AI — Railway deploy config (Railpack / Python 3.11)
# Do not add nixpacks.toml, Procfile, or Dockerfile unless required.
# Python version: .python-version + RAILPACK_PYTHON_VERSION=3.11 in Railway Variables.

[deploy]
startCommand = "uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1"
healthcheckPath = "/health"
healthcheckTimeout = 120
